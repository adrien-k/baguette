<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual"
    />
    <link rel="icon" type="image/svg+xml" href="/baguette.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Baguette</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('baguette-color-scheme');
          if (s === 'light' || s === 'dark') {
            document.documentElement.dataset.theme = s;
            document.documentElement.style.colorScheme = s;
          } else {
            document.documentElement.dataset.theme = 'dark';
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
