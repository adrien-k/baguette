AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  EC2 host for Baguette — a cloud-UI for coding agents.

Parameters:
  DomainName:
    Type: String
    Description: >-
      App domain (DOMAIN in CI) — Kamal serves www.<DomainName>, *.<DomainName>,
      and redirects <DomainName> (apex) to www
    AllowedPattern: '^([a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$'
    ConstraintDescription: Must be a valid DNS hostname (e.g. baguette.example.com)

  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID that contains DomainName (e.g. Z1234567890ABC)
    AllowedPattern: '^Z[A-Z0-9]+$'

  AcmeEmail:
    Type: String
    Description: Email for Let's Encrypt / acme.sh account registration
    AllowedPattern: '^[^@]+@[^@]+\.[^@]+$'

  InstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type (2 vCPU / 4 GiB recommended for remote Docker builds)

  VolumeSize:
    Type: Number
    Default: 40
    MinValue: 20
    MaxValue: 2000
    Description: Root EBS volume size in GiB

  VolumeType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - gp2

  SshIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >-
      CIDR allowed for SSH (port 22) — used by Kamal/GitHub Actions deploys only.
      Admin access uses SSM Session Manager (no SSH key required).

  SsmKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^(|arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]+:(key|alias)/[A-Za-z0-9/:_\-]+)$'
    ConstraintDescription: Must be empty or a KMS key/alias ARN (e.g. arn:aws:kms:us-east-1:123456789012:key/…)
    Description: >-
      Optional KMS key encrypting the SSM agent data key (Session Manager
      preferences or SSM default host management configuration). Grants the
      instance role kms:Decrypt/GenerateDataKey on it; leave empty when the
      account does not use KMS-encrypted SSM sessions.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the instance and security group (default VPC is fine)

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet (route to an Internet Gateway) for the instance and Elastic IP

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 LTS AMI (SSM parameter path)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: DNS & TLS
        Parameters:
          - DomainName
          - HostedZoneId
          - AcmeEmail
      - Label:
          default: EC2
        Parameters:
          - VpcId
          - SubnetId
          - InstanceType
          - VolumeSize
          - VolumeType
          - AmiId
          - SshIngressCidr
          - SsmKmsKeyArn

Conditions:
  HasSsmKmsKey: !Not [!Equals [!Ref SsmKmsKeyArn, '']]

Resources:
  BaguetteHostRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-baguette-host-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AcmeDnsAwsRoute53
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: route53:ListHostedZones
                Resource: '*'
              - Effect: Allow
                Action: route53:GetChange
                Resource: arn:aws:route53:::change/*
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:ListResourceRecordSets
                Resource: !Sub 'arn:aws:route53:::hostedzone/${HostedZoneId}'
        # SSM Agent decrypts its data key with the account's SSM-managed key
        # (alias/aws/ssm) when Session Manager preferences or the default host
        # management configuration turn on agent data key encryption. Without
        # this the agent fails its handshake ("Fetching data key failed:
        # AccessDeniedException kms:Decrypt"). The alias grant is inert until
        # the alias/key exist.
        - PolicyName: SsmDataKeyKms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm'
                  - !If
                    - HasSsmKmsKey
                    - !Ref SsmKmsKeyArn
                    - !Ref 'AWS::NoValue'

  BaguetteHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BaguetteHostRole

  BaguetteSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Baguette Kamal - SSH, HTTP, HTTPS
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshIngressCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-baguette'

  BaguetteElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-baguette'

  BootstrapWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  BaguetteInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref BaguetteHostInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !Ref BaguetteSecurityGroup
          SubnetId: !Ref SubnetId
      BlockDeviceMappings:
        # /dev/sda1 is the root device name of the Ubuntu 24.04 canonical AMI
        # (exposed as nvme0n1 on Nitro). DeleteOnTermination: false keeps the
        # volume when the instance is replaced or the stack is deleted. The
        # replacement boots a FRESH root volume — the old one is kept but NOT
        # re-attached; recover data per the recreate flow in
        # docs/deployment/aws-ec2-kamal.md.
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: !Ref VolumeType
            DeleteOnTermination: false
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-baguette'
      # Embedded from userdata.sh by provision-stack.sh (render / create / update).
      UserData:
        Fn::Base64: !Sub |
          @@USERDATA@@

  BootstrapWait:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: BaguetteInstance
    Properties:
      Handle: !Ref BootstrapWaitHandle
      Timeout: '1500'
      Count: 1

  BaguetteEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt BaguetteElasticIp.AllocationId
      InstanceId: !Ref BaguetteInstance

  # No dedicated www record: the wildcard covers www.<DomainName> and the
  # session preview subdomains alike.
  WildcardDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '*.${DomainName}'
      Type: A
      TTL: 300
      ResourceRecords:
        - !Ref BaguetteElasticIp

  ApexDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: 300
      ResourceRecords:
        - !Ref BaguetteElasticIp

Outputs:
  DeployServer:
    Description: >-
      Optional GitHub Actions variable DEPLOY_SERVER (suggested www hostname;
      DOMAIN over SSH resolves via the apex A record)
    Value: !Sub 'www.${DomainName}'

  Domain:
    Description: GitHub Actions variable DOMAIN
    Value: !Ref DomainName

  ElasticIp:
    Description: Public Elastic IP (www and wildcard DNS)
    Value: !Ref BaguetteElasticIp

  InstanceId:
    Description: EC2 instance ID
    Value: !Ref BaguetteInstance

  WwwUrl:
    Description: Baguette UI URL after deploy
    Value: !Sub 'https://www.${DomainName}'

  SsmStartSessionCommand:
    Description: Interactive shell on the instance (requires Session Manager plugin)
    Value: !Sub 'aws ssm start-session --target ${BaguetteInstance} --region ${AWS::Region}'
