config:
  session:
    env:
      # Per-session SQLite/migrations — not the Baguette server DATA_DIR (~/.baguette).
      # Hardcoded for local preview sessions only — not used in production.
      DATA_DIR: './.data'
      ENCRYPTION_KEY: 'baguette-local-preview-encryption-key-not-for-prod'
      DEV_USER_GH_KEY: '${{ baguette.secrets.DEV_USER_GH_KEY }}'
      PUBLIC_HOST: '${{ baguette.services.app.public_uri }}'
      SOCKET_PATH: '/_baguette/ws/${{ baguette.session.short_id }}'
    init: |
      mkdir -p .data ../../../dev-data-dir
      pnpm install:all
      pnpm run migrate
    tasks:
      run-tests:
        run: pnpm test
      lint:
        run: pnpm run lint
      migrate-dev-environment:
        run: pnpm run migrate
      dev-data:load:
        # Replaces ./.data with ../../../dev-data-dir, migrates, then message backfills (temporary).
        run: |
          set -e
          src="../../../dev-data-dir"
          if [ ! -d "$src" ]; then
            echo "Dev data source not found: $src" >&2
            exit 1
          fi
          rm -rf .data
          cp -a "$src" .data
          pnpm run migrate
          node scripts/2026100601_backfill-message-rows.js
          node scripts/2026100602_backfill-dedupe-streamed-assistants.js
      dev-server:
        # Starts Express (on $PORT) + Vite dev server (on $VITE_PORT) concurrently.
        # Vite proxies /api, /auth, /socket.io to Express.
        run: pnpm run dev
        ports: [PORT, VITE_PORT]
  services:
    app:
      task: dev-server
      expose: VITE_PORT
