name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy (secrets and variables)
        required: true
        type: environment

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'smplee' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add deploy server to known hosts
        run: ssh-keyscan ${{ vars.DEPLOY_SERVER }} >> ~/.ssh/known_hosts

      - name: Renew SSL certificate
        run: ssh ${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_SERVER }} '/home/${{ vars.DEPLOY_USER || 'ubuntu' }}/acme.sh/renew.sh'

      # Build and push are split from deploy to avoid ECONNRESET on registry port forwarding.
      # A long build (~280s) drops the SSH tunnel Kamal uses to push the image, causing
      # "Connection reset by peer". Running them separately keeps the tunnel short-lived.
      # See: https://github.com/basecamp/kamal/discussions/1326
      - name: Build and push image
        env:
          DEPLOY_SERVER: ${{ vars.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: kamal build push

      - name: Deploy with Kamal
        env:
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          AUTH_GITHUB_APP_SLUG: ${{ secrets.AUTH_GITHUB_APP_SLUG || '' }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DEPLOY_SERVER: ${{ vars.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: kamal deploy --skip-push
