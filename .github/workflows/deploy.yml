name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy (secrets and variables)
        required: true
        type: environment

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'smplee' }}

    env:
      DEPLOY_SERVER: ${{ vars.DEPLOY_SERVER || vars.DOMAIN }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal

      - name: Set up Docker Buildx for cache
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Runtime for cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add deploy server to known hosts
        run: ssh-keyscan "$DEPLOY_SERVER" >> ~/.ssh/known_hosts

      - name: Renew SSL certificate
        run: ssh "$DEPLOY_USER@$DEPLOY_SERVER" "/home/$DEPLOY_USER/acme.sh/renew.sh"

      # Build and push are split from deploy to avoid ECONNRESET on registry port forwarding.
      # A long build (~280s) drops the SSH tunnel Kamal uses to push the image, causing
      # "Connection reset by peer". Running them separately keeps the tunnel short-lived.
      # See: https://github.com/basecamp/kamal/discussions/1326
      - name: Build and push image
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          DOCKER_REGISTRY_SERVER: ${{ vars.DOCKER_REGISTRY_SERVER }}
          DOCKER_REGISTRY_USERNAME: ${{ vars.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          OAUTH2_PROXY_PROVIDER: ${{ vars.OAUTH2_PROXY_PROVIDER }}
          OAUTH2_PROXY_EMAIL_DOMAINS: ${{ vars.OAUTH2_PROXY_EMAIL_DOMAINS }}
          OAUTH2_PROXY_OIDC_ISSUER_URL: ${{ vars.OAUTH2_PROXY_OIDC_ISSUER_URL }}
          OAUTH2_PROXY_COOKIE_DOMAINS: ${{ vars.OAUTH2_PROXY_COOKIE_DOMAINS }}
          OAUTH2_PROXY_SKIP_AUTH_REGEX: ${{ vars.OAUTH2_PROXY_SKIP_AUTH_REGEX }}
        run: kamal build push

      - name: Deploy with Kamal
        env:
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          AUTH_GITHUB_APP_SLUG: ${{ secrets.AUTH_GITHUB_APP_SLUG }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          DOCKER_REGISTRY_SERVER: ${{ vars.DOCKER_REGISTRY_SERVER }}
          DOCKER_REGISTRY_USERNAME: ${{ vars.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          OAUTH2_PROXY_PROVIDER: ${{ vars.OAUTH2_PROXY_PROVIDER }}
          OAUTH2_PROXY_EMAIL_DOMAINS: ${{ vars.OAUTH2_PROXY_EMAIL_DOMAINS }}
          OAUTH2_PROXY_CLIENT_ID: ${{ secrets.OAUTH2_PROXY_CLIENT_ID }}
          OAUTH2_PROXY_CLIENT_SECRET: ${{ secrets.OAUTH2_PROXY_CLIENT_SECRET }}
          OAUTH2_PROXY_COOKIE_SECRET: ${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}
          OAUTH2_PROXY_OIDC_ISSUER_URL: ${{ vars.OAUTH2_PROXY_OIDC_ISSUER_URL }}
          OAUTH2_PROXY_COOKIE_DOMAINS: ${{ vars.OAUTH2_PROXY_COOKIE_DOMAINS }}
          OAUTH2_PROXY_SKIP_AUTH_REGEX: ${{ vars.OAUTH2_PROXY_SKIP_AUTH_REGEX }}
        run: kamal deploy --skip-push
